name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint packages
        run: pnpm lint

      - name: Test packages
        run: pnpm test:ci

      - name: Install website dependencies
        env:
          HUSKY: 0
        run: pnpm -C website install --frozen-lockfile

      - name: Build website
        run: pnpm -C website build

  rust:
    name: Rust
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install fish protobuf shellcheck

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      # bundle/specs-ir is generated, not committed. Tests read the real hook
      # modules out of it and skip when it is absent, so compile it before
      # testing or those assertions never run. Node builtins only, no install.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Compile spec IR
        run: node scripts/compile-spec-ir.mjs

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --color always -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # A zero exit code proves nothing on its own: the engine tolerates a
      # missing specs dir and prints an empty suggestion list. Assert that the
      # bundled git spec actually resolved. Same gate as rust-linux / rust-windows.
      - name: Headless engine complete
        run: |
          cargo run --locked -p ec_cli -- engine complete --buffer "git ch" | tee engine-complete.json
          grep -q '"name": "checkout"' engine-complete.json

      # Smoke-build the shipped binaries with the distribution profile so that
      # profile-specific breakage (panic = "abort", LTO, strip) is caught in CI
      # rather than only surfacing during a release. Mirrors scripts/build-app.sh.
      - name: Build release binaries (dist profile)
        run: cargo build --locked --profile dist -p fig_desktop -p figterm -p ec_cli -p fig_input_method

  # Native Linux compile of the completion stack plus the GPUI desktop host.
  # Overlay caret is X11 + IBus. Do not install WebKit — the UI is GPUI.
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/ec-runtime
    steps:
      - uses: actions/checkout@v7

      # Do not apt-install shellcheck. Only the macOS rust job brew-installs it
      # and runs those lints. Headless tests skip shellcheck when the binary is
      # missing so this job stays aligned with what we actually ship here.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            clang libclang-dev \
            protobuf-compiler \
            zsh fish \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libx11-xcb-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libvulkan-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libayatana-appindicator3-dev
          mkdir -p "$XDG_RUNTIME_DIR"

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Compile spec IR
        run: node scripts/compile-spec-ir.mjs

      - name: Clippy (headless crates)
        run: cargo clippy --locked -p fig_os_shim -p fig_util -p fig_proto -p fig_settings -p fig_log -p ec_engine -p fig_integrations -p fig_install -p ec_cli -p fig_ipc -p figterm -p ec_hitoolbox -p fig_input_method --color always -- -D warnings

      - name: Test (headless crates)
        run: cargo test --locked -p fig_os_shim -p fig_util -p fig_proto -p fig_settings -p fig_log -p ec_engine -p fig_integrations -p fig_install -p ec_cli -p fig_ipc -p figterm -p ec_hitoolbox -p fig_input_method

      # A zero exit code proves nothing on its own: the engine tolerates a
      # missing specs dir and prints an empty suggestion list. Assert that the
      # bundled git spec actually resolved.
      - name: Headless engine complete
        shell: bash
        run: |
          cargo run --locked -p ec_cli -- engine complete --buffer "git ch" | tee engine-complete.json
          grep -q '"name": "checkout"' engine-complete.json

      - name: Clippy (desktop host)
        run: cargo clippy --locked -p ec_gpui -p fig_desktop --color always -- -D warnings

      # list/theme/overlay + Linux Xft scale + Windows F5 SetWindowPos flags.
      # No DISPLAY: none of these open a window.
      - name: Test (GPUI overlay policy)
        run: cargo test --locked -p ec_gpui

      # Full fig_desktop unit/policy suite on Linux: linux_caret (IBus/AT-SPI
      # match rules + mock-bus tests that skip without dbus-daemon), shared
      # caret conversion (including Win32 F4), overlay placement, and
      # include_str pins for macos.rs. Not a live X11/IBus/AT-SPI session,
      # not live Accessibility/IME, not live HWND.
      - name: Test (desktop host)
        run: cargo test --locked -p fig_desktop

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # Same crate list as rust-linux, including ec_hitoolbox / fig_input_method
    # policy pins (no live TIS / IMK / cfprefsd). This is the MSVC compile of
    # ConPTY, named pipes, and GPUI HWND — not a live desktop session.
    # GetGUIThreadInfo, SetWindowPos against a real HWND, and ConPTY I/O are
    # not exercised.
    # The named-pipe accept/connect test is cfg(windows) and runs here only;
    # F1 slug / F2 ~user / F3 BOOL / F4 caret / F5 SetWindowPos flags / F6 zip
    # layout are unit-tested on Linux too. No shellcheck/zsh/fish; those
    # tests skip when the binary is missing (same as rust-linux). protoc is
    # fetched by fig_proto/build.rs when PATH has none.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Compile spec IR
        run: node scripts/compile-spec-ir.mjs

      - name: Clippy (headless crates)
        run: cargo clippy --locked -p fig_os_shim -p fig_util -p fig_proto -p fig_settings -p fig_log -p ec_engine -p fig_integrations -p fig_install -p ec_cli -p fig_ipc -p figterm -p ec_hitoolbox -p fig_input_method --color always -- -D warnings

      - name: Test (headless crates)
        run: cargo test --locked -p fig_os_shim -p fig_util -p fig_proto -p fig_settings -p fig_log -p ec_engine -p fig_integrations -p fig_install -p ec_cli -p fig_ipc -p figterm -p ec_hitoolbox -p fig_input_method

      # A zero exit code proves nothing on its own: the engine tolerates a
      # missing specs dir and prints an empty suggestion list. Assert that the
      # bundled git spec actually resolved.
      - name: Headless engine complete
        shell: bash
        run: |
          cargo run --locked -p ec_cli -- engine complete --buffer "git ch" | tee engine-complete.json
          grep -q '"name": "checkout"' engine-complete.json

      - name: Clippy (desktop host)
        run: cargo clippy --locked -p ec_gpui -p fig_desktop --color always -- -D warnings

      - name: Test (GPUI overlay policy)
        run: cargo test --locked -p ec_gpui

      # Same fig_desktop suite as rust-linux. linux_caret is cfg(linux) so it
      # is not compiled here. Named-pipe accept/connect stays cfg(windows);
      # GetGUIThreadInfo, SetWindowPos against a real HWND, and ConPTY I/O
      # are still not exercised.
      - name: Test (desktop host)
        run: cargo test --locked -p fig_desktop
